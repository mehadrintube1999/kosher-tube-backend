name: Update Search Index

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-index:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests xmltodict

      - name: Run Index Generator
        run: |
          python -c "
          import json, requests, xmltodict
          try:
              with open('channels.json', 'r', encoding='utf-8') as f:
                  channels = json.load(f)
              
              all_videos = []
              for ch in channels:
                  pid = ch.get('playlistId', '')
                  name = ch.get('name', '')
                  if not pid: continue
                  url = f'https://www.youtube.com/feeds/videos.xml?playlist_id={pid}'
                  res = requests.get(url, timeout=10)
                  if res.status_code == 200:
                      data = xmltodict.parse(res.content)
                      feed = data.get('feed', {})
                      entries = feed.get('entry', [])
                      if isinstance(entries, dict): entries = [entries]
                      for entry in entries:
                          title = entry.get('title', '')
                          vid = entry.get('yt:videoId', '')
                          if title and vid:
                              all_videos.append({
                                  'title': title,
                                  'videoId': vid,
                                  'channelName': name,
                                  'lengthSeconds': 120
                              })
              with open('search_index.json', 'w', encoding='utf-8') as f:
                  json.dump(all_videos, f, ensure_ascii=False, indent=2)
              print('Successfully generated search_index.json with', len(all_videos), 'videos')
          except Exception as e:
              print('Error:', e)
              exit(1)
          "

      - name: Commit and push if changed
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
          git add search_index.json
          git diff --staged --quiet || git commit -m 'Auto-update search index'
          git push
